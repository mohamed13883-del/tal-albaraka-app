/* Responsive desktop/mobile layout — independent of Tailwind breakpoints */
html,body,#root{width:100%;min-height:100%;}
body{overflow-x:hidden;}
.page-shell{width:min(1500px,calc(100% - 32px));margin:0 auto;padding:16px;}
.app-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start;}
.side-nav{display:block;position:sticky;top:16px;min-width:0;}
.side-nav button{min-height:46px;}
main{min-width:0;width:100%;}
.overflow-auto{max-width:100%;overflow:auto;}
.card3d{max-width:100%;}
@media (max-width:1100px){
 .page-shell{width:calc(100% - 24px);padding:12px;}
 .app-layout{grid-template-columns:210px minmax(0,1fr);gap:14px;}
}

 .page-shell{width:100%;padding:10px;}

 .side-nav{position:static;width:100%;display:flex;overflow-x:auto;gap:6px;padding:8px;white-space:nowrap;}
 .side-nav>div:first-child{display:none;}
 .side-nav button{width:auto!important;flex:0 0 auto;margin:0!important;padding:10px 12px!important;}
 .side-nav button span{font-size:13px;}
 main{width:100%;}
}
@media (min-width:801px){
 .app-layout .side-nav{height:max-content;}
}
@media (min-width:1200px){
 .page-shell{padding:20px;}
 .app-layout{grid-template-columns:260px minmax(0,1fr);gap:24px;}
}

.gps-leaflet{position:absolute;inset:0;z-index:0}.gps-leaflet .leaflet-control-zoom a{background:#061725;color:#eef8ff;border-color:#23445b}.gps-leaflet .leaflet-control-attribution{background:rgba(2,12,22,.72);color:#b8d0df;font-size:8px}.gps-leaflet .leaflet-control-attribution a{color:#7edcff}.gps-overlay{position:absolute;inset:0;z-index:2;pointer-events:none}.gps-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(68,147,181,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(68,147,181,.10) 1px,transparent 1px);background-size:34px 34px;opacity:.75}
.gps-road{position:absolute;height:12px;background:rgba(255,255,255,.07);transform:rotate(-18deg);left:-5%;right:-5%;top:47%;border-top:1px solid rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.04)}
.gps-ring{position:absolute;width:190px;height:190px;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);border:1px solid rgba(34,229,138,.35);background:rgba(34,229,138,.10);box-shadow:0 0 0 24px rgba(34,229,138,.025),0 0 45px rgba(34,229,138,.10)}
.gps-pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-62%) rotate(-45deg);width:34px;height:34px;border-radius:50% 50% 50% 0;background:#0d91ee;border:3px solid #d9f5ff;box-shadow:0 0 0 7px rgba(13,145,238,.20),0 8px 22px rgba(0,0,0,.4)}
.gps-pin:after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;left:9px;top:9px}
.gps-meta{position:absolute;top:14px;right:14px;left:14px;display:flex;justify-content:space-between;gap:10px;z-index:2}.gps-chip{background:rgba(2,12,22,.76);border:1px solid rgba(92,190,226,.18);backdrop-filter:blur(8px);padding:8px 11px;border-radius:12px;font-size:11px}.gps-bottom{position:absolute;bottom:12px;right:12px;left:12px;z-index:2;display:flex;justify-content:space-between;align-items:end;gap:10px}.gps-legend{display:flex;gap:12px;font-size:11px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-left:5px}.dot.green{background:var(--pro-green);box-shadow:0 0 12px rgba(34,229,138,.75)}.dot.red{background:var(--pro-red);box-shadow:0 0 12px rgba(255,70,103,.7)}.dot.blue{background:#1599ff;box-shadow:0 0 12px rgba(21,153,255,.7)}
.gps-status{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:13px;background:rgba(34,229,138,.08);border:1px solid rgba(34,229,138,.18);color:#9affc8;font-size:12px}.gps-status.out{background:rgba(255,70,103,.08);border-color:rgba(255,70,103,.18);color:#ff9eb0}
.pro-header{position:relative}.pro-header:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(25,200,255,.07),transparent);pointer-events:none}
@media(max-width:900px){.page-shell{padding:10px}.app-layout{grid-template-columns:1fr}.side-nav{position:sticky;top:6px;z-index:20}.gps-ring{width:150px;height:150px}}

async function resolveEmployeeForAuth(uid,email,token){

      const es=await fbGet("employees",token);

          if(String(v?.authUid||"")===String(uid))candidates.push([id,v,14]);
          else if(em && String(v?.email||"").trim().toLowerCase()===em)candidates.push([id,v,13]);

}
