async function authSignIn(email, password) {
  const res = await fetch(`${AUTH_BASE}:signInWithPassword?key=${FIREBASE_API_KEY}`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password, returnSecureToken: true }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(mapAuthError(data.error?.message));
  return data;
}
async function authSignUp(email, password) {

    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password, returnSecureToken: true }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(mapAuthError(data.error?.message));
  return data;
}
async function authRefresh(refreshToken) {
  const res = await fetch(`${REFRESH_BASE}?key=${FIREBASE_API_KEY}`, {
    method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(refreshToken)}`,
  });
  const data = await res.json();
  if (!res.ok) throw new Error("تعذر تجديد الجلسة");
  return { idToken: data.id_token, refreshToken: data.refresh_token, expiresIn: data.expires_in };
}

function flattenByUid(obj) {
  if (!obj) return [];
  const out = [];
  Object.keys(obj).forEach((uid) => {
    const child = obj[uid];
    if (child && typeof child === "object") {
      Object.keys(child).forEach((k) => {
        const rec = child[k];
        if (rec && typeof rec === "object") out.push({ ...rec, employeeId: uid, id: rec.id || k });
      });
    }
  });
  return out;
}
function objToArray(obj) {
  if (!obj) return [];
  return Object.entries(obj).map(([id, v]) => ({ ...v, id }));
}

function haversineMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
function todayStr() { return new Date().toISOString().slice(0, 10); }

function payBreakdown(emp, deduction) {
  const net = (emp.baseSalary || 0) - (deduction || 0);
  if (emp.paymentMethod === "bank") return { net, cashPart: 0, bankPart: net };
  if (emp.paymentMethod === "split") {
    const cashPart = Math.min(emp.splitCashAmount || 0, Math.max(net, 0));
    return { net, cashPart, bankPart: net - cashPart };
  }
  return { net, cashPart: net, bankPart: 0 }; // cash (default)
}
function paymentMethodLabel(emp) {
  if (emp.paymentMethod === "bank") return "تحويل بنكي / شبكة بالكامل";
  if (emp.paymentMethod === "split") return `كاش ${fmtMoney(emp.splitCashAmount || 0)} + الباقي شبكة`;
  return "كاش بالكامل";
}

function SelfieCapture({ onCapture, onCancel }) {
  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const [error, setError] = useState("");
  const [ready, setReady] = useState(false);
  useEffect(() => {
    let mounted = true;
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
      .then((stream) => { if (!mounted) return; streamRef.current = stream; if (videoRef.current) { videoRef.current.srcObject = stream; videoRef.current.play(); setReady(true); } })
      .catch(() => setError("مفيش صلاحية وصول للكاميرا. اسمح للتطبيق بالكاميرا من إعدادات المتصفح."));
    return () => { mounted = false; if (streamRef.current) streamRef.current.getTracks().forEach((t) => t.stop()); };
  }, []);
  const capture = () => {
    const video = videoRef.current;
    if (!video) return;
    const canvas = document.createElement("canvas");
    const size = 240; canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext("2d");
    const vw = video.videoWidth, vh = video.videoHeight, min = Math.min(vw, vh);
    ctx.drawImage(video, (vw - min) / 2, (vh - min) / 2, min, min, 0, 0, size, size);
    const dataUrl = canvas.toDataURL("image/jpeg", 0.6);
    if (streamRef.current) streamRef.current.getTracks().forEach((t) => t.stop());
    onCapture(dataUrl);
  };
  return (
    <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-2xl p-4 w-full max-w-xs">
        <p className="text-sm font-medium mb-3 text-center">التقط صورة سيلفي لتأكيد الحضور</p>
        {error ? <div className="text-red-600 text-sm text-center py-6">{error}</div> : (
          <div className="relative w-full aspect-square bg-gray-100 rounded-xl overflow-hidden flex items-center justify-center">
            <video ref={videoRef} className="w-full h-full object-cover" style={{ transform: "scaleX(-1)" }} muted playsInline />
            {!ready && <Loader2 className="absolute animate-spin text-gray-400" size={28} />}
          </div>
        )}
        <div className="flex gap-2 mt-4">
          <Button variant="outline" onClick={onCancel} className="flex-1"><X size={16} /> إلغاء</Button>
          <Button onClick={capture} disabled={!ready} className="flex-1"><Camera size={16} /> التقاط</Button>
        </div>
      </div>
    </div>
  );
}

function EmployeeDashboard({ user, branch, attendance, advances, leaves, onAddAttendance, onRequestAdvance, onRequestLeave, onLogout }) {
  const [tab, setTab] = useState("home");
  const [showCamera, setShowCamera] = useState(false);
  const [pendingAction, setPendingAction] = useState(null);
  const [locStatus, setLocStatus] = useState(null);
  const [busy, setBusy] = useState(false);
  const [advAmount, setAdvAmount] = useState("");
  const [advInstallments, setAdvInstallments] = useState("3");
  const [advError, setAdvError] = useState("");
  const [leaveForm, setLeaveForm] = useState({ type: "annual", start: todayStr(), end: todayStr(), reason: "" });
  const [leaveError, setLeaveError] = useState("");

  const myAttendance = attendance.slice().sort((a, b) => (a.date < b.date ? 1 : -1));
  const todayRecord = myAttendance.find((a) => a.date === todayStr());
  const activeAdvance = advances.find((a) => a.status === "approved" && a.remainingInstallments > 0);
  const usedAnnual = leaves.filter((l) => l.type === "annual" && l.status === "approved" && l.startDate.startsWith(String(thisYear()))).reduce((s, l) => s + l.days, 0);

  const startAction = (type) => {
    setPendingAction(type); setLocStatus("checking");
    if (!navigator.geolocation) { setLocStatus({ ok: false, msg: "الجهاز مش بيدعم تحديد الموقع" }); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => { const dist = haversineMeters(pos.coords.latitude, pos.coords.longitude, branch.lat, branch.lng); setLocStatus({ ok: dist <= branch.radiusMeters, dist: Math.round(dist), lat: pos.coords.latitude, lng: pos.coords.longitude }); },
      () => setLocStatus({ ok: false, msg: "لازم تسمح بالوصول لموقعك الجغرافي" }),
      { enableHighAccuracy: true, timeout: 10000 }
    );
  };
  const proceedToCamera = () => { if (locStatus && locStatus.ok) setShowCamera(true); };
  const handleCapture = async (dataUrl) => {
    setShowCamera(false); setBusy(true);
    await onAddAttendance({ type: pendingAction, selfie: dataUrl, distance: locStatus.dist });
    setBusy(false); setPendingAction(null); setLocStatus(null);

  const submitAdvance = async () => {
    setAdvError("");
    const amount = parseFloat(advAmount);

    await onRequestAdvance({ amount, installments });
    setAdvAmount(""); setAdvInstallments("3");
  };
  const submitLeave = async () => {
    setLeaveError("");
    if (leaveForm.end < leaveForm.start) return setLeaveError("تاريخ النهاية قبل البداية");
    const days = daysBetween(leaveForm.start, leaveForm.end);

    await onRequestLeave({ ...leaveForm, days });
    setLeaveForm({ type: "annual", start: todayStr(), end: todayStr(), reason: "" });

  const pay = payBreakdown(user, deduction);

          <button key={k} onClick={() => setTab(k)} className={`flex-1 text-xs py-2 rounded-lg font-medium ${tab === k ? "bg-teal-600 text-white" : "bg-gray-100 text-gray-600"}`}>{label}</button>

      </div>

      {tab === "home" && (

            {pendingAction && (

                  <p className="text-xs text-red-600 flex items-center gap-1"><AlertTriangle size={14} /> {locStatus.msg || `أنت بعيد عن موقع العمل (${locStatus.dist} متر). لازم تكون في نطاق ${branch.radiusMeters} متر.`}</p>

              <select value={advInstallments} onChange={(e) => setAdvInstallments(e.target.value)} className="w-full border border-gray-300 rounded-xl px-3 py-2.5 text-sm">

          </Card>
          <Card>
            <p className="text-sm font-medium mb-3">طلباتي</p>

function BranchForm({ branch, onSave }) {
  const [form, setForm] = useState(branch);
  const [locating, setLocating] = useState(false);
  const [searchQuery, setSearchQuery] = useState("");
  const [searching, setSearching] = useState(false);
  const [searchError, setSearchError] = useState("");
  const mapDivRef = useRef(null);
  const mapRef = useRef(null);
  const markerRef = useRef(null);

  useEffect(() => setForm(branch), [branch.id]);

  // إنشاء الخريطة مرة واحدة وتحديث موقع الدبوس لما الإحداثيات تتغير
  useEffect(() => {
    if (!window.L || !mapDivRef.current) return;
    if (!mapRef.current) {
      const map = window.L.map(mapDivRef.current).setView([form.lat, form.lng], 12);
      window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OpenStreetMap" }).addTo(map);
      const marker = window.L.marker([form.lat, form.lng], { draggable: true }).addTo(map);
      marker.on("dragend", () => { const p = marker.getLatLng(); setForm((f) => ({ ...f, lat: p.lat, lng: p.lng })); });
      map.on("click", (e) => { marker.setLatLng(e.latlng); setForm((f) => ({ ...f, lat: e.latlng.lat, lng: e.latlng.lng })); });
      mapRef.current = map; markerRef.current = marker;
    }
    return () => { if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; markerRef.current = null; } };
  }, [branch.id]);

  useEffect(() => {
    if (markerRef.current && mapRef.current) {
      markerRef.current.setLatLng([form.lat, form.lng]);
      mapRef.current.setView([form.lat, form.lng]);
    }
  }, [form.lat, form.lng]);

  const useCurrentLocation = () => { setLocating(true); navigator.geolocation.getCurrentPosition((pos) => { setForm((f) => ({ ...f, lat: pos.coords.latitude, lng: pos.coords.longitude })); setLocating(false); }, () => setLocating(false)); };
  const jumpToCity = (c) => setForm((f) => ({ ...f, lat: c.lat, lng: c.lng }));
  const doSearch = async () => {
    if (!searchQuery.trim()) return;
    setSearching(true); setSearchError("");
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=sa&q=${encodeURIComponent(searchQuery)}`);
      const results = await res.json();
      if (!results || results.length === 0) { setSearchError("مفيش نتيجة، جرب اسم مكان تاني"); }
      else setForm((f) => ({ ...f, lat: parseFloat(results[0].lat), lng: parseFloat(results[0].lon) }));
    } catch (e) { setSearchError("تعذر البحث، جرب تاني"); }
    setSearching(false);
  };

  return (
    <div className="space-y-2">
      <input placeholder="اسم الفرع" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} className="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm" />
      <div className="flex gap-2">
        {CITY_PRESETS.map((c) => (
          <button key={c.label} onClick={() => jumpToCity(c)} className="flex-1 text-xs py-1.5 rounded-lg bg-gray-100 text-gray-700">{c.label}</button>
        ))}
      </div>
      <div className="flex gap-2">
        <input placeholder="ابحث عن حي أو مكان بالمدينة" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="flex-1 border border-gray-300 rounded-xl px-3 py-2 text-sm" />
        <Button onClick={doSearch} disabled={searching} className="text-xs px-3">{searching ? "..." : "بحث"}</Button>
      </div>
      {searchError && <p className="text-red-600 text-xs">{searchError}</p>}
      <div ref={mapDivRef} style={{ width: "100%", height: 220, borderRadius: 12, overflow: "hidden" }} />
      <p className="text-xs text-gray-400">دوس على الخريطة أو اسحب الدبوس لتحديد الموقع بالظبط</p>
      <Button variant="outline" onClick={useCurrentLocation} disabled={locating} className="w-full text-xs"><MapPin size={14} /> {locating ? "جاري التحديد..." : "استخدم موقعي الحالي"}</Button>
      <input type="number" placeholder="نطاق السماح بالمتر" value={form.radiusMeters} onChange={(e) => setForm({ ...form, radiusMeters: parseFloat(e.target.value) })} className="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm" />
      <Button onClick={() => onSave(form)} className="w-full text-sm">حفظ بيانات الفرع</Button>
    </div>
  );
}

  { key: "settings", label: "الإعدادات" },

function hasPerm(profile, key) {
  if (!profile) return false;
  if (profile.role !== "admin") return false;
  if (!profile.permissions) return true; // مشرف أساسي بدون قيد = صلاحية كاملة
  return !!profile.permissions[key];
}

      <select value={form.paymentMethod} onChange={(e) => setForm({ ...form, paymentMethod: e.target.value })} className="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm">
        <option value="cash">كاش بالكامل</option>
        <option value="bank">تحويل بنكي / شبكة بالكامل</option>
        <option value="split">تقسيم: جزء كاش وجزء شبكة</option>
      </select>
      {form.paymentMethod === "split" && (
        <input type="number" placeholder="مبلغ الكاش الثابت من الراتب" value={form.splitCashAmount || ""} onChange={(e) => setForm({ ...form, splitCashAmount: parseFloat(e.target.value) || 0 })} className="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm" />
      )}
      <div className="flex gap-2">
        <Button variant="outline" onClick={onCancel} className="flex-1 text-xs">إلغاء</Button>
        <Button onClick={() => onSave(form)} className="flex-1 text-xs">حفظ التعديلات</Button>
      </div>
    </Card>
  );
}

function AdminDashboard({ profile, employees, branches, company, attendance, advances, leaves, onLogout, onSaveBranch, onAddBranch, onDeleteBranch, onAddEmployee, onDeactivateEmployee, onUpdateEmployee, onDecideAdvance, onDecideLeave, onSaveCompany }) {
  const visibleTabs = [
    ["employees", "الموظفين", Users], ["branches", "الفروع", Building2], ["attendance", "الحضور", Clock],
    ["advances", "السلف", Wallet], ["leaves", "الإجازات", CalendarDays], ["reports", "التقارير", FileBarChart], ["settings", "الإعدادات", Settings],
  ].filter(([key]) => hasPerm(profile, key));
  const [tab, setTab] = useState(visibleTabs[0]?.[0] || "employees");
  const [accountType, setAccountType] = useState("employee"); // employee | admin
  const [newEmp, setNewEmp] = useState({ name: "", email: "", password: "", baseSalary: "", paymentMethod: "cash", splitCashAmount: "", branchId: branches[0]?.id || "" });
  const [newAdminPerms, setNewAdminPerms] = useState(Object.fromEntries(ADMIN_PERMISSION_LIST.map((p) => [p.key, true])));
  const [empError, setEmpError] = useState("");
  const [empBusy, setEmpBusy] = useState(false);
  const [editingEmpId, setEditingEmpId] = useState(null);
  const [newBranchName, setNewBranchName] = useState("");
  const [editBranchId, setEditBranchId] = useState(branches[0]?.id || "");
  const [reportMonth, setReportMonth] = useState(monthKey(todayStr()));
  const [companyName, setCompanyName] = useState(company.companyName);

  const pendingAdvances = advances.filter((a) => a.status === "pending");
  const pendingLeaves = leaves.filter((l) => l.status === "pending");
  const activeEmployees = employees.filter((e) => e.role !== "admin" && e.active !== false);
  const activeAdmins = employees.filter((e) => e.role === "admin" && e.active !== false);

  const addEmployee = async () => {
    setEmpError("");
    if (!newEmp.name || !newEmp.email || !newEmp.password) return setEmpError("املأ كل الحقول");
    if (newEmp.password.length < 6) return setEmpError("كلمة المرور لازم 6 حروف على الأقل");
    if (accountType === "employee" && !newEmp.branchId) return setEmpError("اختار الفرع");
    setEmpBusy(true);
    try {
      if (accountType === "admin") {
        await onAddEmployee({ name: newEmp.name, email: newEmp.email, password: newEmp.password, role: "admin", permissions: newAdminPerms });
      } else {
        await onAddEmployee({ ...newEmp, role: "employee" });
      }
      setNewEmp({ name: "", email: "", password: "", baseSalary: "", paymentMethod: "cash", splitCashAmount: "", branchId: branches[0]?.id || "" });
      setNewAdminPerms(Object.fromEntries(ADMIN_PERMISSION_LIST.map((p) => [p.key, true])));
    } catch (e) { setEmpError(e.message || "حصل خطأ في إنشاء الحساب"); }
    setEmpBusy(false);
  };
  const addBranch = () => { if (!newBranchName) return; const b = { id: uid(), name: newBranchName, lat: 21.4858, lng: 39.1925, radiusMeters: 300 }; onAddBranch(b); setNewBranchName(""); setEditBranchId(b.id); };

  const monthlyReport = useMemo(() => activeEmployees.map((e) => {
    const records = attendance.filter((a) => a.employeeId === e.id && monthKey(a.date) === reportMonth);
    const presentDays = records.filter((r) => r.checkInTime).length;
    const leaveDays = leaves.filter((l) => l.employeeId === e.id && l.status === "approved" && monthKey(l.startDate) === reportMonth).reduce((s, l) => s + l.days, 0);
    const activeAdvance = advances.find((a) => a.employeeId === e.id && a.status === "approved" && a.remainingInstallments > 0);
    const deduction = activeAdvance ? activeAdvance.installmentAmount : 0;
    const pay = payBreakdown(e, deduction);
    return { emp: e, presentDays, leaveDays, deduction, net: pay.net, cashPart: pay.cashPart, bankPart: pay.bankPart };
  }), [activeEmployees, attendance, leaves, advances, reportMonth]);

  const exportExcel = () => {
    if (!window.XLSX) { alert("مكتبة Excel لسه بتحمّل، جرب تاني بعد ثانية"); return; }
    const rows = monthlyReport.map((r) => ({
      "الاسم": r.emp.name, "أيام الحضور": r.presentDays, "أيام الإجازة": r.leaveDays,

      "كاش": r.cashPart, "شبكة": r.bankPart,
    }));
    const ws = window.XLSX.utils.json_to_sheet(rows);
    const wb = window.XLSX.utils.book_new();
    window.XLSX.utils.book_append_sheet(wb, ws, "تقرير");
    window.XLSX.writeFile(wb, `تقرير-رواتب-${reportMonth}.xlsx`);
  };
  const exportPDF = () => {

function App() {
  const [session, setSession] = useState(null); // {idToken, refreshToken, uid, expiresAt}
  const [profile, setProfile] = useState(null);
  const [loadingApp, setLoadingApp] = useState(false);
  const [employees, setEmployees] = useState([]);
  const [branches, setBranches] = useState([]);
  const [company, setCompany] = useState(DEFAULT_COMPANY);
  const [attendance, setAttendance] = useState([]);
  const [advances, setAdvances] = useState([]);
  const [leaves, setLeaves] = useState([]);

  const [restoring, setRestoring] = useState(true);

  const handleLogin = async (email, password) => {
    const authData = await authSignIn(email, password);
    const prof = await fbGet(`employees/${authData.localId}`, authData.idToken);
    if (!prof) throw new Error("حسابك مش مسجل كموظف في النظام. كلم المشرف يضيفك.");
    setSession({ idToken: authData.idToken, refreshToken: authData.refreshToken, uid: authData.localId, expiresAt: Date.now() + parseInt(authData.expiresIn, 10) * 1000 });
    setProfile(prof);
    try { localStorage.setItem("tal_session", JSON.stringify({ refreshToken: authData.refreshToken })); } catch (e) {}
  };
  const handleLogout = () => {
    setSession(null); setProfile(null); setEmployees([]); setBranches([]); setAttendance([]); setAdvances([]); setLeaves([]);
    try { localStorage.removeItem("tal_session"); } catch (e) {}
  };

  // استرجاع الجلسة تلقائيًا بعد أي ريفريش للصفحة
  useEffect(() => {
    (async () => {
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem("tal_session") || "null"); } catch (e) {}
      if (!saved || !saved.refreshToken) { setRestoring(false); return; }
      try {
        const r = await authRefresh(saved.refreshToken);
        const uidFromToken = JSON.parse(atob(r.idToken.split(".")[1])).user_id;
        const p = await fbGet(`employees/${uidFromToken}`, r.idToken);
        if (!p) throw new Error("no profile");
        setSession({ idToken: r.idToken, refreshToken: r.refreshToken, uid: uidFromToken, expiresAt: Date.now() + parseInt(r.expiresIn, 10) * 1000 });
        setProfile(p);
        localStorage.setItem("tal_session", JSON.stringify({ refreshToken: r.refreshToken }));
      } catch (e) {
        try { localStorage.removeItem("tal_session"); } catch (e2) {}
      }
      setRestoring(false);
    })();
  }, []);

  useEffect(() => {
    if (!session) return;
    const interval = setInterval(async () => {
      try { const r = await authRefresh(session.refreshToken); setSession((s) => (s ? { ...s, idToken: r.idToken, refreshToken: r.refreshToken, expiresAt: Date.now() + parseInt(r.expiresIn, 10) * 1000 } : s)); }
      catch (e) { console.error(e); }
    }, 50 * 60 * 1000);
    return () => clearInterval(interval);
  }, [session]);

  useEffect(() => {
    if (!session || !profile) return;
    (async () => {
      setLoadingApp(true);
      if (profile.role === "admin") {
        const [emp, br, comp, att, adv, lv] = await Promise.all([
          fbGet("employees", session.idToken), fbGet("branches", session.idToken), fbGet("company", session.idToken),
          fbGet("attendance", session.idToken), fbGet("advances", session.idToken), fbGet("leaves", session.idToken),
        ]);
        setEmployees(objToArray(emp));
        let brArr = objToArray(br);
        if (brArr.length === 0) { await fbPut(`branches/${DEFAULT_BRANCH.id}`, DEFAULT_BRANCH, session.idToken); brArr = [DEFAULT_BRANCH]; }
        setBranches(brArr);
        if (!comp) { await fbPut("company", DEFAULT_COMPANY, session.idToken); setCompany(DEFAULT_COMPANY); } else setCompany(comp);
        setAttendance(flattenByUid(att)); setAdvances(flattenByUid(adv)); setLeaves(flattenByUid(lv));
      } else {
        const [br, comp, att, adv, lv] = await Promise.all([
          fbGet("branches", session.idToken), fbGet("company", session.idToken),
          fbGet(`attendance/${session.uid}`, session.idToken), fbGet(`advances/${session.uid}`, session.idToken), fbGet(`leaves/${session.uid}`, session.idToken),
        ]);
        setBranches(objToArray(br)); setCompany(comp || DEFAULT_COMPANY);
        setAttendance(objToArray(att).map((r) => ({ ...r, employeeId: session.uid })));
        setAdvances(objToArray(adv).map((r) => ({ ...r, employeeId: session.uid })));
        setLeaves(objToArray(lv).map((r) => ({ ...r, employeeId: session.uid })));
      }
      setLoadingApp(false);
    })();
  }, [session, profile]);

  const handleAddAttendance = useCallback(async ({ type, selfie, distance }) => {
    const date = todayStr();
    if (type === "in") {
      const record = { id: date, employeeId: session.uid, date, checkInTime: nowStr(), checkInSelfie: selfie, checkInDistance: distance };
      setAttendance((prev) => [...prev.filter((a) => a.date !== date), record]);
      await fbPut(`attendance/${session.uid}/${date}`, record, session.idToken);
    } else {
      const updates = { checkOutTime: nowStr(), checkOutSelfie: selfie, checkOutDistance: distance };
      setAttendance((prev) => prev.map((a) => (a.date === date ? { ...a, ...updates } : a)));
      await fbPatch(`attendance/${session.uid}/${date}`, updates, session.idToken);
    }
  }, [session]);

  const handleRequestAdvance = useCallback(async ({ amount, installments }) => {
    const id = uid();
    const record = { id, employeeId: session.uid, amount, installmentsCount: installments, installmentAmount: Math.round((amount / installments) * 100) / 100, remainingInstallments: installments, status: "pending", requestDate: todayStr() };
    setAdvances((prev) => [...prev, record]);
    await fbPut(`advances/${session.uid}/${id}`, record, session.idToken);
  }, [session]);

  const handleRequestLeave = useCallback(async ({ type, start, end, reason, days }) => {
    const id = uid();
    const record = { id, employeeId: session.uid, type, startDate: start, endDate: end, reason, days, status: "pending" };
    setLeaves((prev) => [...prev, record]);
    await fbPut(`leaves/${session.uid}/${id}`, record, session.idToken);
  }, [session]);

  const handleDecideAdvance = useCallback(async (record, status) => {
    setAdvances((prev) => prev.map((a) => (a.id === record.id && a.employeeId === record.employeeId ? { ...a, status } : a)));
    await fbPatch(`advances/${record.employeeId}/${record.id}`, { status }, session.idToken);
  }, [session]);
  const handleDecideLeave = useCallback(async (record, status) => {
    setLeaves((prev) => prev.map((l) => (l.id === record.id && l.employeeId === record.employeeId ? { ...l, status } : l)));
    await fbPatch(`leaves/${record.employeeId}/${record.id}`, { status }, session.idToken);
  }, [session]);
  const handleSaveBranch = useCallback(async (b) => { setBranches((prev) => prev.map((x) => (x.id === b.id ? b : x))); await fbPut(`branches/${b.id}`, b, session.idToken); }, [session]);
  const handleAddBranch = useCallback(async (b) => { setBranches((prev) => [...prev, b]); await fbPut(`branches/${b.id}`, b, session.idToken); }, [session]);
  const handleDeleteBranch = useCallback(async (id) => { setBranches((prev) => prev.filter((b) => b.id !== id)); await fbDelete(`branches/${id}`, session.idToken); }, [session]);

  const handleAddEmployee = useCallback(async ({ name, email, password, baseSalary, paymentMethod, splitCashAmount, branchId, role, permissions }) => {
    const authData = await authSignUp(email, password);
    const empUid = authData.localId;
    const profileRec = role === "admin"
      ? { id: empUid, name, role: "admin", permissions, active: true, email }
      : { id: empUid, name, role: "employee", baseSalary: parseFloat(baseSalary) || 0, paymentMethod, splitCashAmount: parseFloat(splitCashAmount) || 0, branchId, active: true, email };
    await fbPut(`employees/${empUid}`, profileRec, session.idToken);
    setEmployees((prev) => [...prev, profileRec]);
  }, [session]);
  const handleUpdateEmployee = useCallback(async (empId, patch) => {
    const clean = { ...patch, baseSalary: parseFloat(patch.baseSalary) || 0, splitCashAmount: parseFloat(patch.splitCashAmount) || 0 };
    setEmployees((prev) => prev.map((e) => (e.id === empId ? { ...e, ...clean } : e)));
    await fbPatch(`employees/${empId}`, clean, session.idToken);
  }, [session]);
  const handleDeactivateEmployee = useCallback(async (empId) => {
    setEmployees((prev) => prev.map((e) => (e.id === empId ? { ...e, active: false } : e)));
    await fbPatch(`employees/${empId}`, { active: false }, session.idToken);
  }, [session]);
  const handleSaveCompany = useCallback(async (c) => { setCompany(c); await fbPut("company", c, session.idToken); }, [session]);

  if (restoring || (session && (loadingApp || !profile))) return <div className="flex items-center justify-center h-64"><Loader2 className="animate-spin text-teal-600" size={28} /></div>;

  const userBranch = profile ? branches.find((b) => b.id === profile.branchId) || branches[0] : null;
  const currentUser = profile ? { ...profile, id: session.uid } : null;

  return (
    <div dir="rtl" className="min-h-screen bg-gray-50" style={{ fontFamily: "system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif" }}>
      {!session && <Login company={DEFAULT_COMPANY} onLogin={handleLogin} />}
      {session && profile && profile.role === "admin" && (
        <AdminDashboard profile={currentUser} employees={employees} branches={branches} company={company} attendance={attendance} advances={advances} leaves={leaves}
          onLogout={handleLogout} onSaveBranch={handleSaveBranch} onAddBranch={handleAddBranch} onDeleteBranch={handleDeleteBranch}
          onAddEmployee={handleAddEmployee} onUpdateEmployee={handleUpdateEmployee} onDeactivateEmployee={handleDeactivateEmployee} onDecideAdvance={handleDecideAdvance} onDecideLeave={handleDecideLeave} onSaveCompany={handleSaveCompany} />
      )}
      {session && profile && profile.role === "employee" && (
        <EmployeeDashboard user={currentUser} branch={userBranch} attendance={attendance} advances={advances} leaves={leaves}
          onAddAttendance={handleAddAttendance} onRequestAdvance={handleRequestAdvance} onRequestLeave={handleRequestLeave} onLogout={handleLogout} />
      )}
    </div>
  );
}

</script>

<script>
  function showError(title, message) {
    var d = document.getElementById("diag");
    d.style.display = "block";
    d.textContent = title + ":\n" + message;
    var l = document.getElementById("loading");
    if (l) l.remove();
  }
  window.addEventListener("error", function (e) {
    showError("JS ERROR", (e.message || "") + "\nFile: " + (e.filename || "") + "\nLine: " + (e.lineno || "") + ":" + (e.colno || "") + (e.error && e.error.stack ? "\n\n" + e.error.stack : ""));
  });
  try {
    var src = document.getElementById("app-source").textContent;
    var compiled = Babel.transform(src, {
      presets: [["react", { runtime: "classic" }]]
    }).code;
    var s = document.createElement("script");
    s.text = compiled;
    document.body.appendChild(s);
    var loadingEl = document.getElementById("loading");
    if (loadingEl) loadingEl.remove();
    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(window.App));
  } catch (err) {
    showError("COMPILE/RENDER ERROR", err.message + (err.stack ? "\n\n" + err.stack : ""));
  }
</script>
</body>
</html>
