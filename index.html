input,select,button{font:inherit} .app-bg{min-height:100vh;background:

.glass{background:linear-gradient(145deg,rgba(20,35,55,.86),rgba(9,20,34,.72));border:1px solid rgba(148,163,184,.16);box-shadow:0 20px 50px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(16px)}

.muted{color:#8ea2b8}.pill{border:1px solid rgba(148,163,184,.18);background:rgba(255,255,255,.04)}

const FIREBASE_API_KEY="AIzaSyB6kleNEq_qopMOjtvhtGZKfhf-Ud7OaEk";
const DB_URL="https://tal-albaraka-default-rtdb.asia-southeast1.firebasedatabase.app";
const AUTH_BASE="https://identitytoolkit.googleapis.com/v1/accounts";
const REFRESH_BASE="https://securetoken.googleapis.com/v1/token";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const now=()=>{const d=new Date();return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}:${String(d.getSeconds()).padStart(2,"0")}`};
const monthKey=s=>s.slice(0,7); const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/86400000)+1;
const money=n=>Number(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const minutes=t=>{if(!t)return null;const [h,m,s=(0)]=t.split(":").map(Number);return h*60+m+Number(s)/60};
const hoursBetween=(a,b)=>{const x=minutes(a),y=minutes(b);if(x==null||y==null)return 0;return Math.max(0,(y-x)/60)};
async function auth(path,body){const r=await fetch(`${AUTH_BASE}:${path}?key=${FIREBASE_API_KEY}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error?.message||"Authentication failed");return d}
const signIn=(email,password)=>auth("signInWithPassword",{email,password,returnSecureToken:true});
const signUp=(email,password)=>auth("signUp",{email,password,returnSecureToken:true});
const refresh=async token=>{const r=await fetch(`${REFRESH_BASE}?key=${FIREBASE_API_KEY}`,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:`grant_type=refresh_token&refresh_token=${encodeURIComponent(token)}`});const d=await r.json();if(!r.ok)throw Error("Session refresh failed");return {idToken:d.id_token,refreshToken:d.refresh_token,expiresIn:d.expires_in}};
async function fbGet(path,token){const r=await fetch(`${DB_URL}/${path}.json?auth=${token}`);return r.ok?r.json():null}
async function fbPut(path,data,token){const r=await fetch(`${DB_URL}/${path}.json?auth=${token}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});if(!r.ok)throw Error("Database write failed")}
async function fbPatch(path,data,token){const r=await fetch(`${DB_URL}/${path}.json?auth=${token}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});if(!r.ok)throw Error("Database update failed")}
async function fbDelete(path,token){await fetch(`${DB_URL}/${path}.json?auth=${token}`,{method:"DELETE"})}
function flatten(obj){if(!obj)return[];const out=[];Object.entries(obj).forEach(([uid,v])=>{if(v&&typeof v==="object")Object.entries(v).forEach(([k,r])=>{if(r&&typeof r==="object")out.push({...r,employeeId:uid,id:r.id||k})})});return out}
const DEFAULT_BRANCH={id:"main",name:"Main Branch",lat:21.4858,lng:39.1925,radiusMeters:300,shiftStart:"09:00",shiftEnd:"17:00",graceMinutes:15,requiredHours:8,monthlyWorkDays:26,weeklyOffDays:4};
const DEFAULT_COMPANY={companyName:"Tal Al Baraka"};
const PERMS=["employees","branches","attendance","advances","leaves","reports","settings"];
function Btn({children,onClick,kind="primary",disabled=false}){const c=kind==="danger"?"bg-red-500":kind==="secondary"?"bg-slate-700":"bg-teal-500";return <button disabled={disabled} onClick={onClick} className={`${c} btn3d disabled:opacity-40 text-white rounded-xl px-4 py-2.5 text-sm font-semibold`}>{children}</button>}
function Card({children,className=""}){return <div className={`glass card3d rounded-2xl p-4 ${className}`}>{children}</div>}
function Badge({children,tone="slate"}){const c={green:"text-emerald-300 bg-emerald-400/10",red:"text-red-300 bg-red-400/10",amber:"text-amber-300 bg-amber-400/10",blue:"text-blue-300 bg-blue-400/10",slate:"text-slate-300 bg-slate-400/10"}[tone];return <span className={`px-2.5 py-1 rounded-full text-xs ${c}`}>{children}</span>}

function Decisions({title,items,employees,onDecision,kind}){return <Card><h3 className="font-bold mb-3">{title}</h3>{items.map(x=><div key={x.id} className="flex flex-wrap justify-between gap-3 p-3 pill rounded-xl mb-2"><div><div className="font-semibold">{employees.find(e=>e.id===x.employeeId)?.name||x.employeeId}</div><div className="text-sm muted">{kind==="advance"?`${money(x.amount)} • ${x.installmentsCount} installments`:`${x.startDate} → ${x.endDate} • ${x.days} days`}</div></div><div className="flex gap-2">{x.status==="pending"?<><Btn onClick={()=>onDecision(x,"approved")}>Approve</Btn><Btn kind="danger" onClick={()=>onDecision(x,"rejected")}>Reject</Btn></>:<Badge tone={x.status==="approved"?"green":"red"}>{x.status}</Badge>}</div></div>)}</Card>}
function App(){const[session,setSession]=useState(null),[profile,setProfile]=useState(null),[employees,setEmployees]=useState([]),[branches,setBranches]=useState([]),[attendance,setAttendance]=useState([]),[advances,setAdvances]=useState([]),[leaves,setLeaves]=useState([]),[loading,setLoading]=useState(true);const load=useCallback(async(s,p)=>{const[es,bs,as,avs,ls]=await Promise.all([fbGet("employees",s),fbGet("branches",s),fbGet("attendance",s),fbGet("advances",s),fbGet("leaves",s)]);setEmployees(es?Object.entries(es).map(([id,v])=>({...v,id})):[]);setBranches(bs?Object.entries(bs).map(([id,v])=>({...v,id})):[]);setAttendance(flatten(as));setAdvances(flatten(avs));setLeaves(flatten(ls));},[]);const login=async(email,password)=>{const d=await signIn(email,password),p=await fbGet(`employees/${d.localId}`,d.idToken);if(!p)throw Error("Employee profile not found.");const s={idToken:d.idToken,refreshToken:d.refreshToken,uid:d.localId};setSession(s);setProfile({...p,id:d.localId});localStorage.setItem("tal_session",JSON.stringify({refreshToken:d.refreshToken}));await load(s,p)};useEffect(()=>{(async()=>{try{const z=JSON.parse(localStorage.getItem("tal_session")||"null");if(z?.refreshToken){const r=await refresh(z.refreshToken),uidFrom=JSON.parse(atob(r.idToken.split(".")[1])).user_id,p=await fbGet(`employees/${uidFrom}`,r.idToken);if(p){const s={idToken:r.idToken,refreshToken:r.refreshToken,uid:uidFrom};setSession(s);setProfile({...p,id:uidFrom});await load(s,p)}}}catch(e){}setLoading(false)})()},[load]);const logout=()=>{setSession(null);setProfile(null);localStorage.removeItem("tal_session")};const branch=branches.find(b=>b.id===profile?.branchId)||branches[0]||DEFAULT_BRANCH;const addAttendance=async({type,selfie,distance,lat,lng})=>{const date=today(),stamp=now();if(type==="in"){const rec={id:date,employeeId:session.uid,date,checkInTime:stamp,checkInSelfie:selfie,checkInDistance:distance,checkInLat:lat,checkInLng:lng,verified:true};await fbPut(`attendance/${session.uid}/${date}`,rec,session.idToken);setAttendance(a=>[...a.filter(x=>!(x.employeeId===session.uid&&x.date===date)),rec])}else{const old=attendance.find(a=>a.employeeId===session.uid&&a.date===date);const work=hoursBetween(old?.checkInTime,stamp),ot=Math.max(0,work-(branch.requiredHours||8));const up={checkOutTime:stamp,checkOutSelfie:selfie,checkOutDistance:distance,checkOutLat:lat,checkOutLng:lng,workHours:work,overtimeHours:ot,verified:true};await fbPatch(`attendance/${session.uid}/${date}`,up,session.idToken);setAttendance(a=>a.map(x=>x.employeeId===session.uid&&x.date===date?{...x,...up}:x))}};const addAdvance=async({amount,installments})=>{const id=uid(),r={id,employeeId:session.uid,amount,installmentsCount:installments,installmentAmount:Math.round(amount/installments*100)/100,remainingInstallments:installments,status:"pending",requestDate:today()};await fbPut(`advances/${session.uid}/${id}`,r,session.idToken);setAdvances(a=>[...a,r])};const addLeave=async(x)=>{const id=uid(),r={...x,id,employeeId:session.uid,status:"pending"};await fbPut(`leaves/${session.uid}/${id}`,r,session.idToken);setLeaves(a=>[...a,r])};const addEmp=async(x)=>{const d=await signUp(x.email,x.password),id=d.localId,r={id,name:x.name,role:"employee",baseSalary:Number(x.baseSalary)||0,paymentMethod:x.paymentMethod,networkAmount:Number(x.networkAmount)||0,branchId:x.branchId,active:true,email:x.email};await fbPut(`employees/${id}`,r,session.idToken);setEmployees(e=>[...e,r])};const updateEmp=async(id,p)=>{const r={...p,baseSalary:Number(p.baseSalary)||0,networkAmount:Number(p.networkAmount)||0};await fbPatch(`employees/${id}`,r,session.idToken);setEmployees(e=>e.map(x=>x.id===id?{...x,...r}:x))};const deactivate=async id=>{await fbPatch(`employees/${id}`,{active:false},session.idToken);setEmployees(e=>e.map(x=>x.id===id?{...x,active:false}:x))};const saveBranch=async b=>{await fbPut(`branches/${b.id}`,b,session.idToken);setBranches(x=>x.map(y=>y.id===b.id?b:y))};const addBranch=async b=>{await fbPut(`branches/${b.id}`,b,session.idToken);setBranches(x=>[...x,b])};const deleteBranch=async id=>{await fbDelete(`branches/${id}`,session.idToken);setBranches(x=>x.filter(b=>b.id!==id))};const decision=async(r,status,type)=>{const path=type==="leave"?"leaves":"advances";await fbPatch(`${path}/${r.employeeId}/${r.id}`,{status},session.idToken);const set=type==="leave"?setLeaves:setAdvances;set(a=>a.map(x=>x.id===r.id&&x.employeeId===r.employeeId?{...x,status}:x))};if(loading)return <div className="app-bg min-h-screen grid place-items-center">Loading…</div>;if(!session)return <Login onLogin={login}/>;return <div className="app-bg min-h-screen">{profile.role==="admin"?<Admin profile={profile} employees={employees} branches={branches} attendance={attendance} advances={advances} leaves={leaves} onLogout={logout} onAddEmployee={addEmp} onUpdateEmployee={updateEmp} onDeactivate={deactivate} onSaveBranch={saveBranch} onAddBranch={addBranch} onDeleteBranch={deleteBranch} onDecision={(r,s)=>decision(r,s,"advance")} onLeaveDecision={(r,s)=>decision(r,s,"leave")}/>:<Employee user={profile} branch={branch} attendance={attendance.filter(a=>a.employeeId===session.uid)} advances={advances.filter(a=>a.employeeId===session.uid)} leaves={leaves.filter(a=>a.employeeId===session.uid)} onAttendance={addAttendance} onAdvance={addAdvance} onLeave={addLeave} onLogout={logout}/>}</div>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body></html>
