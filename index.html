<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#e7eef7;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
input,select,button{font:inherit} .app-bg{min-height:100vh;background:
radial-gradient(circle at 15% 15%,rgba(20,184,166,.18),transparent 28%),
radial-gradient(circle at 85% 10%,rgba(59,130,246,.16),transparent 25%),
linear-gradient(135deg,#06101d 0%,#0a1728 55%,#08111f 100%)}
.glass{background:linear-gradient(145deg,rgba(20,35,55,.86),rgba(9,20,34,.72));border:1px solid rgba(148,163,184,.16);box-shadow:0 20px 50px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(16px)}
.card3d{transform-style:preserve-3d;transition:.25s;position:relative;overflow:hidden}.card3d:hover{transform:translateY(-3px) rotateX(1deg);box-shadow:0 28px 60px rgba(0,0,0,.35)}
.card3d:before{content:"";position:absolute;inset:-40% auto auto -20%;width:180px;height:180px;background:rgba(45,212,191,.10);filter:blur(35px);border-radius:50%}
.btn3d{box-shadow:0 7px 0 rgba(0,0,0,.22),0 14px 30px rgba(0,0,0,.2);transform:translateY(0);transition:.15s}.btn3d:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.field{background:#091827;border:1px solid #24364b;color:#e7eef7;border-radius:12px;padding:11px 13px;width:100%;outline:none}.field:focus{border-color:#2dd4bf;box-shadow:0 0 0 3px rgba(45,212,191,.1)}
.muted{color:#8ea2b8}.pill{border:1px solid rgba(148,163,184,.18);background:rgba(255,255,255,.04)}
table{width:100%;border-collapse:separate;border-spacing:0 8px}th{color:#8298ae;font-size:12px;font-weight:600;text-align:left;padding:4px 10px}td{background:rgba(12,28,45,.8);padding:12px 10px;border-top:1px solid rgba(148,163,184,.08);border-bottom:1px solid rgba(148,163,184,.08);font-size:13px}td:first-child{border-radius:12px 0 0 12px}td:last-child{border-radius:0 12px 12px 0}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#263b52;border-radius:20px}
</style>
