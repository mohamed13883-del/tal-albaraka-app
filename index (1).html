<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>تال البركة — نظام الحضور والرواتب</title><style>
:root{--bg:#f3f6fb;--cd:#fff;--tx:#0f1b2d;--mu:#64748b;--bd:#e3e9f2;--pr:#0d9488;--pt:#fff;--ac:#2563eb;--ok:#15803d;--wr:#b45309;--er:#dc2626;--sf:#f8fafc;--sh:0 6px 20px rgba(15,27,45,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1220;--cd:#111c30;--tx:#e8eef8;--mu:#8fa3bd;--bd:#22324c;--pr:#2dd4bf;--pt:#04201c;--ac:#60a5fa;--ok:#4ade80;--wr:#fbbf24;--er:#f87171;--sf:#0e1829;--sh:0 6px 20px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1220;--cd:#111c30;--tx:#e8eef8;--mu:#8fa3bd;--bd:#22324c;--pr:#2dd4bf;--pt:#04201c;--ac:#60a5fa;--ok:#4ade80;--wr:#fbbf24;--er:#f87171;--sf:#0e1829;--sh:0 6px 20px rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 "Segoe UI",Tahoma,Arial,sans-serif}
.app{max-width:1180px;margin:auto;padding:14px 14px 96px}
header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--pr),var(--ac));display:grid;place-items:center;color:#fff;font-size:22px;flex:none}
h1{font-size:18px;margin:0}h2{font-size:17px;margin:0}h3{margin:0 0 6px}.mu{color:var(--mu);font-size:13px}.sp{flex:1}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;border-radius:12px}
.nav button b{font-size:19px;font-weight:400}.nav .on{color:var(--pr);font-weight:700}
@media(min-width:900px){.app{padding:20px 236px 30px 20px}.nav{top:0;bottom:0;left:auto;width:212px;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-left:1px solid var(--bd);padding:84px 10px 10px}.nav button{flex:none;flex-direction:row;gap:10px;font-size:14px;padding:11px 12px;justify-content:flex-start}.nav .on{background:var(--sf)}}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:var(--sh)}
.g{display:grid;gap:12px;margin-bottom:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.st b{display:block;font-size:25px;line-height:1.3}.st span{color:var(--mu);font-size:13px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row.j{justify-content:space-between}
.btn{border:0;border-radius:11px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;background:var(--pr);color:var(--pt)}.b2{background:var(--sf);color:var(--tx);border:1px solid var(--bd)}.bd{background:var(--er);color:#fff}.sm{padding:5px 10px;font-size:13px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:11px;background:var(--sf);color:var(--tx);font:inherit}
textarea{min-height:110px;font-size:12px;direction:ltr}label{display:block;font-size:13px;color:var(--mu);margin:9px 0 3px}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--sf);border:1px solid var(--bd)}.ok{color:var(--ok)}.wr{color:var(--wr)}.er{color:var(--er)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:12px;font-weight:600}tfoot td{font-weight:700;border:0}.sc{overflow-x:auto}
.mb{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:14px;z-index:20}.mc{background:var(--cd);border-radius:18px;padding:18px;width:100%;max-width:470px;max-height:88vh;overflow:auto;color:var(--tx)}
.bar{height:8px;border-radius:9px;background:var(--bd);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--pr)}
.ch{display:flex;align-items:flex-end;gap:8px;height:96px}.ch div{flex:1;text-align:center;font-size:11px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.ch i{display:block;background:linear-gradient(var(--pr),var(--ac));border-radius:6px 6px 0 0;min-height:3px}
.em{text-align:center;padding:30px 10px;color:var(--mu)}.em b{display:block;font-size:34px}
.tt{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:12px;z-index:30;font-size:14px}
@media print{.nav,.noprint,header{display:none!important}body.mo #app{display:none!important}.mb{position:static;background:none;display:block;padding:0}.mc{max-height:none;border:0;max-width:none}.app{padding:0}}
</style></head><body><div class="app" id="app"></div><nav class="nav" id="nav"></nav><div id="m"></div><div id="t"></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),today=()=>dstr(new Date());
const nowT=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())},mins=t=>{if(!t)return null;const[a,b]=t.split(':').map(Number);return a*60+b};
const money=n=>(Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const ymAdd=(m,n)=>{const[y,o]=m.split('-').map(Number),d=new Date(y,o-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const mdiff=(a,b)=>{const[x,p]=a.split('-').map(Number),[y,q]=b.split('-').map(Number);return(y-x)*12+q-p};
const mDates=m=>{const[y,o]=m.split('-').map(Number);return Array.from({length:new Date(y,o,0).getDate()},(_,i)=>m+'-'+pad(i+1))};
const mName=m=>{const[y,o]=m.split('-');return new Date(y,o-1,1).toLocaleDateString('ar-u-nu-latn',{month:'long',year:'numeric'})};
const dName=d=>new Date(d+'T00:00:00').toLocaleDateString('ar-u-nu-latn',{weekday:'long',day:'numeric',month:'long'});
const def=()=>({co:'تال البركة',st:{wh:8,start:'09:00',ot:1.5,al:21,off:5},emps:[],att:[],adv:[],lv:[]});
let S;try{S=JSON.parse(localStorage.getItem('att_v1'))}catch(e){}S=S||def();
const save=()=>{try{localStorage.setItem('att_v1',JSON.stringify(S))}catch(e){}};
try{const th=localStorage.getItem('att_th');if(th)document.documentElement.dataset.theme=th}catch(e){}
let T='d',D=today(),PM=today().slice(0,7),M={};
const E=id=>S.emps.find(e=>e.id===id),isOff=d=>new Date(d+'T00:00:00').getDay()===+S.st.off,rec=(id,d)=>S.att.find(a=>a.eid===id&&a.d===d);
const lvDates=l=>{const r=[];for(let d=new Date(l.f+'T00:00:00'),e=new Date(l.e+'T00:00:00');d<=e;d.setDate(d.getDate()+1)){const s=dstr(d);if(!isOff(s))r.push(s)}return r};
const onLv=(id,d)=>S.lv.some(l=>l.eid===id&&l.s==='ap'&&l.f<=d&&d<=l.e);
const LT={annual:'سنوية',sick:'مرضية',unpaid:'بدون راتب'},LS={pn:'قيد المراجعة',ap:'معتمدة',rj:'مرفوضة'};
const aIdx=(a,m)=>{const i=mdiff(a.st,m);return i>=0&&i<a.mo&&(!a.cl||m<a.cl)?i:-1};
const aRem=a=>{if(a.cl)return 0;const p=Math.min(a.mo,Math.max(0,mdiff(a.st,today().slice(0,7))));return Math.max(0,a.amt-p*a.amt/a.mo)};
const used=e=>S.lv.filter(l=>l.eid===e.id&&l.s==='ap'&&l.t==='annual'&&l.f.startsWith(today().slice(0,4))).reduce((s,l)=>s+lvDates(l).length,0);
const pay=(e,m)=>{const all=mDates(m).filter(d=>!isOff(d)),t=today(),ds=all.filter(d=>d<=t),lm={},rc={};
S.lv.filter(l=>l.eid===e.id&&l.s==='ap').forEach(l=>lvDates(l).forEach(d=>lm[d]=l.t));S.att.filter(a=>a.eid===e.id&&a.d.startsWith(m)).forEach(a=>rc[a.d]=a);
let pr=0,ab=0,pl=0,late=0,ot=0;ds.forEach(d=>{const r=rc[d];if(r&&r.i){pr++;if(mins(r.i)>mins(S.st.start)+5)late++;if(r.o)ot+=Math.max(0,(mins(r.o)-mins(r.i))/60-S.st.wh)}else if(lm[d]&&lm[d]!=='unpaid')pl++;else ab++});
const daily=e.sal/(all.length||1),otPay=ot*daily/S.st.wh*S.st.ot,abD=ab*daily;let adv=0;S.adv.forEach(a=>{if(a.eid===e.id&&aIdx(a,m)>=0)adv+=a.amt/a.mo});
return{pr,ab,pl,late,ot,daily,otPay,abD,adv,net:e.sal-abD+otPay-adv}};
const F=(i,l,v='',t='text',x='')=>`<label>${l}</label><input id="${i}" type="${t}" value="${esc(v)}" ${x}>`;
const SL=(i,l,o,v)=>`<label>${l}</label><select id="${i}">${o.map(([k,t])=>`<option value="${esc(k)}" ${k==v?'selected':''}>${esc(t)}</option>`).join('')}</select>`;
const v=i=>$('#'+i).value,EO=()=>S.emps.map(e=>[e.id,e.n]);
const toast=m=>{$('#t').innerHTML=`<div class="tt">${esc(m)}</div>`;setTimeout(()=>$('#t').innerHTML='',2600)};
const openM=(t,b,cb,ok='حفظ')=>{M={cb};document.body.classList.add('mo');$('#m').innerHTML=`<div class="mb"><div class="mc"><h3>${t}</h3>${b}<div class="row noprint" style="margin-top:14px">${cb?`<button class="btn" data-a="ok">${ok}</button>`:''}<button class="btn b2" data-a="x">إغلاق</button></div></div></div>`};
const closeM=()=>{document.body.classList.remove('mo');$('#m').innerHTML=''};
const ask=(msg,fn)=>openM('تأكيد',`<p>${msg}</p>`,fn,'تأكيد');
const empty=(i,t,b)=>`<div class="cd em"><b>${i}</b>${t}${b?`<div style="margin-top:12px">${b}</div>`:''}</div>`;
const chip=(t,c)=>`<span class="chip ${c||''}">${t}</span>`;
function vDash(){const t=today(),n=S.emps.length,pr=S.att.filter(a=>a.d===t&&a.i).length,lv=S.emps.filter(e=>onLv(e.id,t)).length,ab=isOff(t)?0:Math.max(0,n-pr-lv);
const rem=S.adv.reduce((s,a)=>s+aRem(a),0),net=S.emps.reduce((s,e)=>s+pay(e,t.slice(0,7)).net,0),pn=S.lv.filter(l=>l.s==='pn').length;
const days=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return dstr(d)});
const ch=days.map(d=>{const c=S.att.filter(a=>a.d===d&&a.i).length;return`<div><span>${c}</span><i style="height:${n?Math.max(4,c/n*70):4}px"></i>${d.slice(8)}</div>`}).join('');
const st=(x,l,c)=>`<div class="cd st"><b class="${c||''}">${x}</b><span>${l}</span></div>`;
return`<div class="g g4">${st(n,'عدد الموظفين')}${st(pr,'حاضر اليوم','ok')}${st(ab,'غائب اليوم',ab?'er':'')}${st(lv,'في إجازة')}${st(pn,'إجازات قيد المراجعة',pn?'wr':'')}${st(money(rem),'السلف المتبقية')}</div>
<div class="g g2"><div class="cd"><h2>الحضور آخر 7 أيام</h2><div class="ch" style="margin-top:12px">${ch}</div></div><div class="cd"><h2>رواتب ${mName(t.slice(0,7))}</h2><div class="st"><b>${money(net)}</b><span>صافي الرواتب المستحقة حتى اليوم</span></div><div class="row" style="margin-top:12px"><button class="btn" data-a="nav" data-i="p">كشف الرواتب</button><button class="btn b2" data-a="nav" data-i="a">تسجيل الحضور</button></div></div></div>
${n?'':empty('👋','ابدأ بإضافة أول موظف لتفعيل الحضور والرواتب','<button class="btn" data-a="eadd">+ إضافة موظف</button>')}`}
function vEmp(){return`<div class="row j" style="margin-bottom:12px"><h2>الموظفون (${S.emps.length})</h2><button class="btn" data-a="eadd">+ موظف جديد</button></div>`+(S.emps.length?`<div class="g g2">${S.emps.map(e=>`<div class="cd"><div class="row j"><div><b>${esc(e.n)}</b><div class="mu">${esc(e.j||'—')} · تعيين ${esc(e.h||'—')}</div></div>${chip(money(e.sal),'ok')}</div><div class="row" style="margin-top:10px"><button class="btn b2 sm" data-a="eadd" data-i="${e.id}">تعديل</button><button class="btn bd sm" data-a="edel" data-i="${e.id}">حذف</button></div></div>`).join('')}</div>`:empty('👥','لا يوجد موظفون بعد'))}
function vAtt(){const t=today(),rows=S.emps.map(e=>{const r=rec(e.id,D),h=r&&r.i&&r.o?((mins(r.o)-mins(r.i))/60).toFixed(1)+' س':'—';
const s=r&&r.i?(r.o?chip('منصرف'):chip('حاضر','ok')):isOff(D)?chip('عطلة'):onLv(e.id,D)?chip('إجازة','wr'):D>t?'—':chip('غائب','er');
const q=D===t?(!r||!r.i?`<button class="btn sm" data-a="in" data-i="${e.id}">حضور</button>`:!r.o?`<button class="btn sm" data-a="out" data-i="${e.id}">انصراف</button>`:''):'';
return`<tr><td><b>${esc(e.n)}</b></td><td>${s}</td><td>${r?.i||'—'}</td><td>${r?.o||'—'}</td><td>${h}</td><td>${q} <button class="btn b2 sm" data-a="aed" data-i="${e.id}">تعديل</button></td></tr>`}).join('');
return`<div class="row j" style="margin-bottom:12px"><div><h2>الحضور والانصراف</h2><div class="mu">${dName(D)}</div></div><input id="ad" type="date" value="${D}" style="width:auto"></div>`+(S.emps.length?`<div class="cd sc"><table><thead><tr><th>الموظف</th><th>الحالة</th><th>حضور</th><th>انصراف</th><th>الساعات</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:empty('⏱','أضف موظفين أولاً لتسجيل حضورهم','<button class="btn" data-a="eadd">+ إضافة موظف</button>'))}
function vAdv(){const cm=today().slice(0,7);return`<div class="row j" style="margin-bottom:12px"><h2>السلف</h2><button class="btn" data-a="aadd">+ سلفة جديدة</button></div>`+(S.adv.length?`<div class="g g2">${S.adv.slice().reverse().map(a=>{const e=E(a.eid),p=Math.min(a.mo,Math.max(0,mdiff(a.st,cm))),r=aRem(a),done=a.cl||p>=a.mo;
return`<div class="cd"><div class="row j"><b>${esc(e?.n||'محذوف')}</b>${a.cl?chip('سُدّدت مبكراً','ok'):done?chip('مكتملة','ok'):chip('جارية','wr')}</div><div class="mu">المبلغ ${money(a.amt)} · قسط ${money(a.amt/a.mo)} × ${a.mo} شهر · يبدأ ${a.st}</div><div class="bar"><i style="width:${a.cl?100:p/a.mo*100}%"></i></div><div class="row j"><span class="mu">المتبقي: <b class="${r?'wr':'ok'}">${money(r)}</b></span><span class="row">${!done?`<button class="btn b2 sm" data-a="asettle" data-i="${a.id}">سداد مبكر</button>`:''}<button class="btn bd sm" data-a="adel" data-i="${a.id}">حذف</button></span></div></div>`}).join('')}</div>`:empty('💸','لا توجد سلف مسجلة'))}
function vLv(){const bal=S.emps.map(e=>{const u=used(e);return`<div class="cd"><b>${esc(e.n)}</b><div class="bar"><i style="width:${Math.min(100,u/S.st.al*100)}%"></i></div><span class="mu">مستخدم ${u} من ${S.st.al} · المتبقي <b>${Math.max(0,S.st.al-u)}</b> يوم</span></div>`}).join('');
const L=S.lv.slice().reverse().map(l=>{const e=E(l.eid);return`<tr><td><b>${esc(e?.n||'محذوف')}</b></td><td>${LT[l.t]}</td><td>${l.f} → ${l.e}</td><td>${lvDates(l).length}</td><td>${chip(LS[l.s],l.s==='ap'?'ok':l.s==='rj'?'er':'wr')}</td><td>${l.s==='pn'?`<button class="btn sm" data-a="lap" data-i="${l.id}">اعتماد</button> <button class="btn b2 sm" data-a="lrj" data-i="${l.id}">رفض</button> `:''}<button class="btn bd sm" data-a="ldel" data-i="${l.id}">حذف</button></td></tr>`}).join('');
return`<div class="row j" style="margin-bottom:12px"><h2>الإجازات</h2><button class="btn" data-a="ladd">+ طلب إجازة</button></div>`+(S.emps.length?`<div class="g g2">${bal}</div>`:'')+(S.lv.length?`<div class="cd sc"><table><thead><tr><th>الموظف</th><th>النوع</th><th>الفترة</th><th>أيام</th><th>الحالة</th><th></th></tr></thead><tbody>${L}</tbody></table></div>`:empty('🌴','لا توجد طلبات إجازة'))}
function vPay(){const R=S.emps.map(e=>({e,p:pay(e,PM)})),sum=k=>R.reduce((s,r)=>s+(k==='sal'?r.e.sal:r.p[k]),0);
return`<div class="row j" style="margin-bottom:12px"><div><h2>كشف الرواتب</h2><div class="mu">${mName(PM)}</div></div><div class="row noprint"><input id="pm" type="month" value="${PM}" style="width:auto"><button class="btn b2" data-a="prt">طباعة</button></div></div>`+(R.length?`<div class="cd sc"><table><thead><tr><th>الموظف</th><th>الراتب</th><th>حضور</th><th>غياب</th><th>تأخير</th><th>إضافي</th><th>سلف</th><th>الصافي</th><th class="noprint"></th></tr></thead><tbody>${R.map(({e,p})=>`<tr><td><b>${esc(e.n)}</b></td><td>${money(e.sal)}</td><td>${p.pr}</td><td class="${p.ab?'er':''}">${p.ab}</td><td>${p.late}</td><td class="ok">${money(p.otPay)}</td><td class="wr">${money(p.adv)}</td><td><b>${money(p.net)}</b></td><td class="noprint"><button class="btn b2 sm" data-a="slip" data-i="${e.id}">قسيمة</button></td></tr>`).join('')}</tbody><tfoot><tr><td>الإجمالي</td><td>${money(sum('sal'))}</td><td colspan="3"></td><td>${money(sum('otPay'))}</td><td>${money(sum('adv'))}</td><td>${money(sum('net'))}</td><td class="noprint"></td></tr></tfoot></table></div><p class="mu">الغياب يُحسب من أيام العمل حتى اليوم (باستثناء العطلة الأسبوعية والإجازات المعتمدة المدفوعة). الإضافي يُحسب بعد ${S.st.wh} ساعات يومياً.</p>`:empty('🧾','أضف موظفين لعرض كشف الرواتب'))}
function vSet(){const s=S.st,dn=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'].map((d,i)=>[i,d]);
return`<h2 style="margin-bottom:12px">الإعدادات</h2><div class="g g2"><div class="cd"><h3>بيانات العمل</h3>${F('co','اسم الشركة',S.co)}${F('wh','ساعات العمل اليومية',s.wh,'number','step="0.5"')}${F('stt','بداية الدوام',s.start,'time')}${F('ot','معامل الإضافي (×)',s.ot,'number','step="0.25"')}${F('al','رصيد الإجازة السنوية (يوم)',s.al,'number')}${SL('off','العطلة الأسبوعية',dn,s.off)}<button class="btn" style="margin-top:12px" data-a="cfg">حفظ الإعدادات</button></div>
<div class="cd"><h3>نسخة احتياطية</h3><p class="mu">البيانات محفوظة على هذا الجهاز فقط. انسخ النص لحفظه أو الصقه لاستعادته.</p><textarea id="bk" readonly>${esc(JSON.stringify(S))}</textarea><label>استعادة من نسخة</label><textarea id="im" placeholder="الصق النسخة هنا"></textarea><div class="row" style="margin-top:10px"><button class="btn b2" data-a="imp">استعادة</button><button class="btn bd" data-a="rst">مسح كل البيانات</button></div></div></div>`}

eadd:id=>{const e=id?E(id):{};openM(id?'تعديل موظف':'موظف جديد',F('n','الاسم الكامل',e.n)+F('j','الوظيفة',e.j)+F('s','الراتب الشهري',e.sal,'number','step="any" inputmode="decimal"')+F('h','تاريخ التعيين',e.h||today(),'date'),()=>{const n=v('n').trim(),s=+v('s');if(!n||!(s>0))return toast('أدخل الاسم وراتباً صحيحاً'),false;if(id)Object.assign(e,{n,j:v('j'),sal:s,h:v('h')});else S.emps.push({id:uid(),n,j:v('j'),sal:s,h:v('h')});save();R()})},

aadd:()=>{if(!S.emps.length)return toast('أضف موظفاً أولاً');openM('سلفة جديدة',SL('e','الموظف',EO())+F('a','مبلغ السلفة','','number','step="any" inputmode="decimal"')+F('mo','عدد أشهر السداد',3,'number','min="1" max="60"')+F('st','أول شهر خصم',ymAdd(today().slice(0,7),1),'month'),()=>{const a=+v('a'),mo=Math.round(+v('mo')),e=E(v('e'));if(!(a>0)||!(mo>=1)||!v('st'))return toast('أكمل البيانات بشكل صحيح'),false;if(a/mo>e.sal)toast('تنبيه: القسط أكبر من الراتب');S.adv.push({id:uid(),eid:e.id,amt:a,mo,st:v('st'),cl:''});save();R()})},

lap:id=>{const l=S.lv.find(x=>x.id===id),e=E(l.eid);if(l.t==='annual'&&used(e)+lvDates(l).length>S.st.al)toast('تنبيه: يتجاوز رصيد الإجازة السنوية');l.s='ap';save();R()},
lrj:id=>{S.lv.find(x=>x.id===id).s='rj';save();R()},ldel:id=>ask('حذف طلب الإجازة؟',()=>{S.lv=S.lv.filter(l=>l.id!==id);save();R()}),
slip:id=>{const e=E(id),p=pay(e,PM),r=(a,b,c)=>`<tr><td>${a}</td><td class="${c||''}">${b}</td></tr>`;openM('قسيمة راتب',`<div class="mu">${esc(S.co)} · ${mName(PM)}</div><h3 style="margin-top:6px">${esc(e.n)} <span class="mu">${esc(e.j||'')}</span></h3><table><tbody>${r('الراتب الأساسي',money(e.sal))}${r('أيام الحضور',p.pr)}${r('أيام الإجازة المدفوعة',p.pl)}${r('أيام الغياب ('+money(p.daily)+'/يوم)',p.ab,p.ab?'er':'')}${r('خصم الغياب','- '+money(p.abD),'er')}${r('ساعات إضافية ('+p.ot.toFixed(1)+' س)','+ '+money(p.otPay),'ok')}${r('قسط السلف','- '+money(p.adv),'wr')}${r('<b>صافي الراتب</b>','<b>'+money(p.net)+'</b>')}</tbody></table><button class="btn noprint" style="margin-top:12px" data-a="prt">🖨 طباعة</button>`)},
